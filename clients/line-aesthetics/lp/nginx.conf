server {
  listen 80;
  root /usr/share/nginx/html;
  absolute_redirect off;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location = / { return 302 /nose-thread-lift; }

  # Drafts awaiting approval: preview host only, 404 on go.lineaestheticsclinic.com
  location ~ ^/face-thread-lift(\.html)?$ {
    if ($host !~* "\.up\.railway\.app$") { return 404; }
    add_header X-Robots-Tag "noindex";
    try_files /face-thread-lift.html =404;
  }
  location / { try_files $uri $uri.html =404; }
  location /assets/ { expires 7d; add_header Cache-Control "public"; }
  location ~* \.(css|js)$ { expires 1h; add_header Cache-Control "public"; }
}
